# XcodeGen spec. Run `xcodegen` in this folder to create WatchLock.xcodeproj.
# Signing (Team ID, bundle ID) lives in Config/Local.xcconfig, which is gitignored.
name: WatchLock
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  WatchLock:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: WatchLock
        excludes:
          - "**/*.example"
    info:
      path: WatchLock/Info.plist
      properties:
        CFBundleDisplayName: WatchLock
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # The Home Screen shortcut opens thumbtax://open?app=Instagram
        CFBundleURLTypes:
          - CFBundleURLName: com.group16hackathon.thumbtax
            CFBundleURLSchemes:
              - thumbtax
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Hackathon convenience: allows plain http:// servers on your LAN.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
